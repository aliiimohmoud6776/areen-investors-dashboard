<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عرين · لوحة المستثمرين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#11130e;--glass:rgba(255,246,228,.055);--glass2:rgba(255,246,228,.09);--line:rgba(255,246,228,.10);--txt:#f2eee4;--mut:#a3a695;--mint:#4fe3b0;--mint2:#27a67a;--warm:#e0b87c;--blue:#7cc8f0;--bad:#f27d7d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;color:var(--txt);background:var(--bg);min-height:100vh;line-height:1.5;padding-top:env(safe-area-inset-top,0px);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
 radial-gradient(900px 520px at 78% -8%,rgba(94,120,70,.38),transparent 62%),
 radial-gradient(700px 480px at 8% 18%,rgba(150,105,60,.26),transparent 60%),
 radial-gradient(800px 600px at 60% 108%,rgba(40,90,70,.34),transparent 60%),var(--bg)}
.shell{display:grid;grid-template-columns:76px 1fr;gap:18px;max-width:1320px;margin:0 auto;padding:18px 16px 40px}
/* rail */
.rail{position:sticky;top:calc(18px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 36px);display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0;background:var(--glass);border:1px solid var(--line);border-radius:26px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.rail .logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,var(--mint),var(--mint2));display:grid;place-items:center;color:#05261b;font-weight:800;font-size:22px;margin-bottom:10px;box-shadow:0 10px 28px rgba(79,227,176,.28)}
.rail a{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--mut);text-decoration:none;transition:.25s}
.rail a:hover,.rail a.on{background:var(--glass2);color:var(--mint)}
.rail .sp{flex:1}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* top */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top h2{margin:0;font-size:22px;font-weight:800}.top small{color:var(--mut)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:13px;color:var(--txt);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.pill b{color:var(--mint)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mint);animation:pulse 2s infinite}
.dot.off{background:var(--bad);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,227,176,.6)}70%{box-shadow:0 0 0 9px rgba(79,227,176,0)}100%{box-shadow:0 0 0 0 rgba(79,227,176,0)}}
/* cards */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:20px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);overflow:hidden;min-width:0;opacity:0;transform:translateY(14px);animation:in .7s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0)*70ms)}
@keyframes in{to{opacity:1;transform:none}}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(260px circle at var(--mx,50%) var(--my,-40%),rgba(255,240,210,.11),transparent 60%);opacity:0;transition:opacity .3s}
.card:hover::after{opacity:1}
.label{font-size:11px;letter-spacing:.14em;color:var(--mut);font-weight:700;margin-bottom:10px;text-transform:uppercase}
h3{margin:0 0 2px;font-size:16px;font-weight:700}.sub{color:var(--mut);font-size:12.5px;margin-bottom:14px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.hero{grid-column:span 8;min-height:300px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;background:
 radial-gradient(420px 260px at 12% 110%,rgba(224,184,124,.30),transparent 65%),
 linear-gradient(120deg,rgba(50,62,40,.75),rgba(24,28,20,.75)),var(--glass)}
.hero .win{position:absolute;inset:0;opacity:.10;background:repeating-linear-gradient(90deg,transparent 0 46px,#fff 46px 48px),repeating-linear-gradient(0deg,transparent 0 46px,#fff 46px 48px);-webkit-mask-image:linear-gradient(200deg,#000,transparent 70%);mask-image:linear-gradient(200deg,#000,transparent 70%)}
.hero>*{position:relative}
.hello{font-size:clamp(28px,4.6vw,46px);font-weight:300;line-height:1.15;margin:4px 0 0}
.hello b{font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid var(--line);font-size:12.5px}
.chip.ok{color:var(--mint)}.chip.bad{color:var(--bad)}
.lead{color:#d8d4c6;font-size:14px;max-width:560px}
.lead b{color:var(--mint);font-weight:700}
.dial{grid-column:span 4;display:flex;flex-direction:column;align-items:center}
.dial .wrap{position:relative;width:100%;max-width:250px;aspect-ratio:1}
.dial svg{width:100%;height:100%}
.dial .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dial .mid .v{font-size:46px;font-weight:300;line-height:1}
.dial .mid .u{font-size:12px;color:var(--mut);margin-top:6px;letter-spacing:.1em}
.legend{width:100%;display:grid;gap:7px;margin-top:6px;font-size:13px}
.legend div{display:flex;justify-content:space-between;gap:8px;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:4px;margin-inline-end:7px}
.scene{grid-column:span 3;display:flex;gap:12px;align-items:center;padding:16px}
.tile{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.07);color:var(--c,var(--mint))}
.scene .t{font-size:13px;color:var(--mut)}.scene .v{font-size:28px;font-weight:800;line-height:1.1}
.scene .v small{font-size:12px;color:var(--mut);font-weight:500;margin-inline-start:4px}
.metric{grid-column:span 3;padding:18px}
.metric .k{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:6px}
.metric .v{font-size:30px;font-weight:300;margin:6px 0 10px}
.metric .v small{font-size:13px;color:var(--mut)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--mint2),var(--mint));transition:width 1s ease}
.metric .f{font-size:11.5px;color:var(--mut);margin-top:8px}
.sec{grid-column:span 12;display:flex;justify-content:space-between;align-items:end;margin:14px 4px 0}
.sec h3{font-size:19px}.sec span{color:var(--mut);font-size:12.5px}
.room{grid-column:span 6;min-height:560px;padding:0;display:flex;flex-direction:column;justify-content:flex-end}
.room .bg{position:absolute;inset:0}
.room.a .bg{background:radial-gradient(380px 240px at 82% 12%,rgba(255,214,150,.45),transparent 62%),linear-gradient(155deg,#5d4a35 0%,#2a2a20 55%,#171a13 100%)}
.room.b .bg{background:radial-gradient(380px 240px at 18% 14%,rgba(150,225,200,.32),transparent 62%),linear-gradient(155deg,#3a4d40 0%,#232a22 55%,#12150f 100%)}
.room.c .bg{background:radial-gradient(380px 240px at 80% 14%,rgba(160,200,240,.30),transparent 62%),linear-gradient(155deg,#37424d 0%,#222721 55%,#12150f 100%)}
.room .bg::before{content:"";position:absolute;inset:0;opacity:.13;background:repeating-linear-gradient(90deg,transparent 0 64px,#fff 64px 66px),repeating-linear-gradient(0deg,transparent 0 72px,#fff 72px 74px);-webkit-mask-image:linear-gradient(180deg,#000 10%,transparent 62%);mask-image:linear-gradient(180deg,#000 10%,transparent 62%)}
.room .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(8,10,6,.72))}
.room .body{position:relative;padding:20px}
.who{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:19px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--c)}
.who .n{font-size:18px;font-weight:700}.who .r{font-size:12.5px;color:#cbc7b8}
.paid-l{font-size:12px;color:#d8d4c6;letter-spacing:.06em}
.paid{font-size:clamp(34px,5vw,48px);font-weight:800;line-height:1.05;color:var(--mint);margin:2px 0 12px}
.paid small{font-size:15px;font-weight:500;color:#cbc7b8;margin-inline-start:6px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{background:rgba(0,0,0,.30);border:1px solid var(--line);border-radius:14px;padding:9px 12px}
.trio span{display:block;font-size:11.5px;color:#bdb9aa}.trio b{font-size:17px}
.seal{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(224,184,124,.16);border:1px solid rgba(224,184,124,.4);color:var(--warm);font-size:12.5px;font-weight:700;margin-bottom:10px}
.eq{font-size:clamp(40px,6vw,58px);font-weight:800;line-height:1;color:var(--warm);margin:2px 0 4px}.eq small{font-size:16px;font-weight:500;color:#cbc7b8;margin-inline-start:6px}
.why{font-size:13px;color:#d8d4c6;margin:0 0 12px;max-width:440px}
.det{margin-top:12px;background:rgba(0,0,0,.32);border:1px solid var(--line);border-radius:16px;padding:6px 14px}
.det .h{font-size:11px;letter-spacing:.12em;color:#bdb9aa;font-weight:700;padding:8px 0 4px}
.det .r{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.det .r:first-of-type{border-top:0}
.det .r .a{color:#d8d4c6}.det .r .b{font-weight:700}.det .r .m{color:var(--mint);font-weight:700;min-width:84px;text-align:left}
.det .svc{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.det .svc span{font-size:11.5px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.det .tot{border-top:1px solid var(--line);margin-top:2px;padding:10px 0 6px;display:flex;justify-content:space-between;font-weight:800}
.det .th{display:grid;grid-template-columns:1fr auto auto;gap:14px;font-size:11px;color:#bdb9aa;padding:6px 0 0}
.det .th span:nth-child(3){min-width:84px;text-align:left}
.price{grid-column:span 12}
.eqn{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:6px 0 18px}
.eqn i{font-style:normal;font-size:26px;color:var(--mut)}
.bx{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:18px;padding:12px 18px;min-width:150px}
.bx span{display:block;font-size:12px;color:var(--mut)}.bx b{font-size:30px;font-weight:300}.bx small{color:var(--mut);margin-inline-start:6px;font-size:12px}
.bx.hi{background:linear-gradient(145deg,rgba(79,227,176,.20),rgba(79,227,176,.06));border-color:rgba(79,227,176,.4)}.bx.hi b{color:var(--mint);font-weight:800}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:26px}.h2{font-size:11px;letter-spacing:.12em;color:var(--mut);font-weight:700;margin-bottom:6px}
.pr{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}.pr:first-of-type{border-top:0}.pr small{color:var(--mut)}
@media (max-width:700px){.cols{grid-template-columns:1fr}.eqn i{display:none}.bx{flex:1 1 100%}}
.cap{grid-column:span 12;padding:18px 20px}
.capbar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.08);margin:12px 0 10px}
.capbar i{display:block;height:100%;transition:width 1s ease}
.caplg{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13px;color:#d8d4c6}
.caplg b{color:var(--txt)}.caplg i{display:inline-block;width:10px;height:10px;border-radius:4px;margin-inline-end:6px}
.comp{grid-column:span 7}.ai{grid-column:span 5}
.row{padding:12px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0;padding-top:0}
.row .l{display:flex;justify-content:space-between;gap:10px;align-items:center}
.row .n{font-weight:700;font-size:14.5px}.row .m{color:var(--mut);font-size:12px}
.row .bar{margin-top:9px}
.ad{grid-column:span 6}.dev{grid-column:span 6}
.state{display:inline-flex;align-items:center;gap:9px;padding:8px 16px;border-radius:999px;font-weight:700;font-size:15px}
.state.on{background:rgba(79,227,176,.14);color:var(--mint)}.state.off{background:rgba(242,125,125,.14);color:var(--bad)}
.note{margin-top:14px;font-size:12.5px;color:#cfcbbd;background:rgba(0,0,0,.25);border:1px dashed var(--line);border-radius:14px;padding:10px 12px}
.bigv{font-size:38px;font-weight:300;margin-top:14px}.bigv small{font-size:14px;color:var(--mut)}
.err{display:none;margin-bottom:12px;padding:10px 14px;border-radius:14px;background:rgba(224,184,124,.14);color:var(--warm);font-size:13px}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:22px}
@media (max-width:1000px){.shell{grid-template-columns:1fr;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
 .rail{position:fixed;inset:auto 12px calc(12px + env(safe-area-inset-bottom,0px)) 12px;top:auto;height:auto;flex-direction:row;justify-content:space-around;padding:8px;z-index:20;border-radius:22px;background:rgba(24,27,20,.82)}
 .rail .logo,.rail .sp{display:none}
 .hero,.dial,.comp,.ai,.ad,.dev,.room{grid-column:span 12}.scene,.metric{grid-column:span 6}}
@media (max-width:560px){.scene,.metric{grid-column:span 12}.trio{grid-template-columns:1fr 1fr 1fr}.trio b{font-size:15px}}
#app.static .card{animation:none;opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.card{animation:none;opacity:1;transform:none}.dot{animation:none}}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="التنقل">
    <div class="logo">ع</div>
    <a href="#top" class="on" title="نظرة عامة" id="r1"></a>
    <a href="#investors" title="المستثمرون" id="r2"></a>
    <a href="#capital" title="رأس المال" id="r3"></a>
    <a href="#components" title="المكونات" id="r4"></a>
    <a href="#campaign" title="الحملة" id="r5"></a>
    <div class="sp"></div>
  </nav>

  <main id="top">
    <div class="top">
      <div><h2 id="pname">منصة عرين</h2><small id="today"></small></div>
      <div class="pills">
        <span class="pill"><span class="dot"></span><span id="rate">سعر الدولار…</span></span>
        <span class="pill" id="upd">—</span>
      </div>
    </div>
    <div class="err" id="err">تعذّر الاتصال بقاعدة البيانات، يتم عرض آخر بيانات محفوظة.</div>

    <div class="grid" id="app"></div>
    <footer>بيانات مباشرة من Supabase · تتحدث تلقائيًا كل 30 ثانية</footer>
  </main>
</div>

<script>
const SUPABASE_URL="https://lmgmagaiosadqnulybwp.supabase.co";
const SUPABASE_KEY="sb_publishable_Sr-YQEenmzFnyptM5Pe8LQ_O1_FTgpU";
let DATA={
  settings:{platform_name:"منصة عرين",developer_name:"أحمد حسن حامد",share_price:1500,code_value:150000,usd_rate:50,trial_teachers:37,pro_teachers:0,students:470,shares_outstanding:100,value_per_student:0,value_per_trial_teacher:0,value_per_pro_teacher:0,ad_campaign_price:13000,ad_campaign_status:"running",ad_auto_stop_on_update:true,last_update_at:new Date().toISOString()},
  expenses:[{name:"اشتراكات الخدمات",note:"SMS · Vercel · Supabase · Domain",amount:600,currency:"USD"}],
  ai:[{model_name:"Claude",accounts:2,price_per_account:2100}],
  investors:[{name:"رامي أحمد جادالله",role:"مستثمر",paid_amount:34800,is_remainder:false,sort_order:1},{name:"أحمد حسن حامد",role:"مبرمج المنصة",paid_amount:null,is_remainder:true,sort_order:2}]
};
let LIVE_RATE=null;
const COL=["#4fe3b0","#e0b87c","#7cc8f0","#c79bf2","#f08fb0"];
const $=id=>document.getElementById(id);
const f=(n,d=0)=>Number(n).toLocaleString("en-US",{maximumFractionDigits:d,minimumFractionDigits:d});
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P={
 grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
 users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
 wallet:'<rect x="2" y="6" width="20" height="14" rx="3"/><path d="M2 10h20M16 14h2"/>',
 mega:'<path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/>',
 box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
 bot:'<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4"/><circle cx="12" cy="3" r="1"/><path d="M9 14h.01M15 14h.01"/>',
 grad:'<path d="M22 10L12 5 2 10l10 5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>',
 star:'<path d="M12 2l3 6.5 7 .9-5.2 4.8 1.4 7L12 17.8 5.8 21.2l1.4-7L2 9.4l7-.9z"/>',
 coin:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4"/>',
 chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
 server:'<rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/>',
 code:'<path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/>'
};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24">${P[n]}</svg>`;
["r1:grid","r2:users","r3:wallet","r4:box","r5:mega"].forEach(x=>{const[a,b]=x.split(":");$(a).innerHTML=ic(b)});

const seen={};
function counters(){
  document.querySelectorAll("[data-count]").forEach(el=>{
    const to=+el.dataset.count,d=+(el.dataset.dec||0),k=el.dataset.key||el.id;
    const from=seen[k]==null?0:seen[k];seen[k]=to;
    if(from===to||matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=f(to,d);return}
    const t0=performance.now(),dur=1100;
    (function step(t){const p=Math.min((t-t0)/dur,1),e=1-Math.pow(1-p,3);el.textContent=f(from+(to-from)*e,d);if(p<1)requestAnimationFrame(step)})(t0);
  });
}
const N=(v,d=0,k)=>`<span class="num" data-count="${v}" data-dec="${d}" data-key="${k}">${f(v,d)}</span>`;

async function q(t,o){const r=await fetch(`${SUPABASE_URL}/rest/v1/${t}?select=*${o?`&order=${o}`:""}`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});if(!r.ok)throw 0;return r.json()}
async function fetchRate(){try{const r=await fetch("https://open.er-api.com/v6/latest/USD");const j=await r.json();if(j&&j.rates&&j.rates.EGP)LIVE_RATE=+j.rates.EGP}catch(e){}}
async function load(){
  await fetchRate();
  try{const[s,e,a,i]=await Promise.all([q("platform_settings"),q("expenses","id"),q("ai_subscriptions","id"),q("investors","sort_order")]);if(!s.length)throw 0;DATA={settings:s[0],expenses:e,ai:a,investors:i};$("err").style.display="none"}catch(x){$("err").style.display="block"}
  render();
}
function calc(){
  const s=DATA.settings,rate=LIVE_RATE||+s.usd_rate;
  const services=DATA.expenses.reduce((t,x)=>t+(x.currency==="USD"?x.amount*rate:+x.amount),0);
  const ai=DATA.ai.reduce((t,x)=>t+x.accounts*x.price_per_account,0);
  const ad=+s.ad_campaign_price,code=+s.code_value,cost=code+services+ai+ad;
  const traction=(+s.students||0)*(+s.value_per_student||0)+(+s.trial_teachers||0)*(+s.value_per_trial_teacher||0)+(+s.pro_teachers||0)*(+s.value_per_pro_teacher||0);
  const total=cost+traction,totalShares=+s.shares_outstanding||100,price=total/totalShares;
  const cash=DATA.investors.filter(x=>!x.is_remainder).reduce((t,x)=>t+(+x.paid_amount||0),0);
  const inv=DATA.investors.map(x=>{const shares=x.is_remainder?Math.max(totalShares-cash/price,0):(+x.paid_amount||0)/price;return{...x,shares,pct:shares/totalShares*100,paid:x.is_remainder?Math.max(total-cash,0):+x.paid_amount}});
  return{services,ai,ad,code,cost,traction,total,totalShares,inv,price,rate,cash};
}

function dial(c){
  const T=72,cx=120,cy=120,r1=92,r2=108,start=-225,span=270;let h="",acc=0;
  const bounds=c.inv.map(x=>{acc+=x.pct;return acc});
  for(let i=0;i<T;i++){
    const pos=i/(T-1)*100;let k=bounds.findIndex(b=>pos<=b+0.0001);if(k<0)k=c.inv.length-1;
    const a=(start+span*i/(T-1))*Math.PI/180,long=i%6===0,ri=long?r1-5:r1;
    h+=`<line x1="${cx+ri*Math.cos(a)}" y1="${cy+ri*Math.sin(a)}" x2="${cx+r2*Math.cos(a)}" y2="${cy+r2*Math.sin(a)}" stroke="${COL[k%5]}" stroke-width="${long?2.6:1.6}" stroke-linecap="round" opacity="${long?1:.78}"/>`;
  }
  return`<svg viewBox="0 0 240 240">${h}</svg>`;
}

function render(){
  const s=DATA.settings,c=calc(),on=s.ad_campaign_status==="running";
  $("pname").textContent=s.platform_name;
  $("today").textContent=new Date().toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  $("rate").innerHTML=`1$ = <b class="num">${f(c.rate,2)}</b> ج.م ${LIVE_RATE?"· لحظي":""}`;
  $("upd").textContent="آخر تحديث: "+new Date(s.last_update_at).toLocaleDateString("ar-EG",{day:"numeric",month:"short",year:"numeric"});
  const hr=new Date().getHours(),greet=hr<12?"صباح الخير":"مساء الخير";
  const rooms=["a","b","c"];
  const svcNames=DATA.expenses.flatMap(e=>String(e.note||e.name).split("·").map(t=>t.trim()).filter(Boolean));
  const aiTxt=DATA.ai.map(a=>`${a.model_name} · ${a.accounts} حساب × ${f(a.price_per_account)}`).join(" + ");
  const items=[["سعر المنصة (كود المشروع)",c.code,null],["الخدمات والاشتراكات التقنية",c.services,svcNames],["اشتراكات "+DATA.ai.map(a=>a.model_name).join(" + "),c.ai,aiTxt],["الحملة الإعلانية",c.ad,on?"شغالة":"متوقفة"]].concat(c.traction>0?[["قيمة المستخدمين (معلمين وطلاب)",c.traction,null]]:[]);
  const invCards=c.inv.map((x,k)=>{
    const head=`<div class="who"><div class="av">${esc((x.name||"؟").trim().charAt(0))}</div><div><div class="n">${esc(x.name)}</div><div class="r">${esc(x.role)}</div></div></div>`;
    if(x.is_remainder){
      return `<article class="card room ${rooms[k%3]}" style="--c:${COL[k%5]};--i:${8+k}"><div class="bg"></div><div class="body">${head}
      <span class="seal">${ic("code")} لم يدفع أي مبلغ نقدي · 0 ج.م</span>
      <div class="paid-l">الأسهم المتبقية تعود إليه</div>
      <div class="eq">${N(x.shares,2,"eq"+k)}<small>سهم</small></div>
      <p class="why">بقية أسهم المنصة بعد أسهم المستثمرين تعود لمبرمجها مقابل بناء الكود وتطويره بالكامل، من غير أي دفع نقدي.</p>
      <div class="trio"><div><span>نسبة الملكية</span><b class="num">${f(x.pct,2)}%</b></div><div><span>قيمة الحصة</span><b class="num">${f(x.shares*c.price)}</b></div><div><span>المدفوع نقدًا</span><b class="num">0</b></div></div>
      <div class="det"><div class="h">كيف تتحسب حصته؟</div>
        <div class="r"><span class="a">إجمالي قيمة المنصة</span><span class="b num">${f(c.total)}</span><span class="m"></span></div>
        <div class="r"><span class="a">ناقص: ما دفعه المستثمرون نقدًا</span><span class="b num">− ${f(c.cash)}</span><span class="m"></span></div>
        <div class="tot"><span>الباقي = حصة المبرمج</span><span class="num" style="color:var(--warm)">${f(x.shares*c.price)} ج.م</span></div></div>
      </div></article>`;
    }
    return `<article class="card room ${rooms[k%3]}" style="--c:${COL[k%5]};--i:${8+k}"><div class="bg"></div><div class="body">${head}
    <div class="paid-l">المبلغ المدفوع نقدًا</div>
    <div class="paid">${N(x.paid,0,"paid"+k)}<small>ج.م</small></div>
    <div class="trio"><div><span>عدد الأسهم</span><b class="num">${f(x.shares,2)}</b></div><div><span>نسبة الملكية</span><b class="num">${f(x.pct,2)}%</b></div><div><span>قيمة الحصة</span><b class="num">${f(x.shares*c.price)}</b></div></div>
    <div class="det"><div class="h">معلومات المنصة وأسعارها</div>
      ${items.map(it=>`<div class="r"><span class="a">${esc(it[0])}</span><span class="b num">${f(it[1])}</span>${Array.isArray(it[2])?`<div class="svc">${it[2].map(n=>`<span>${esc(n)}</span>`).join("")}<span>$${f(DATA.expenses.reduce((t,e)=>t+(e.currency==="USD"?+e.amount:0),0))} × ${f(c.rate,2)}</span></div>`:it[2]?`<div class="svc"><span>${esc(it[2])}</span></div>`:""}</div>`).join("")}
      <div class="tot"><span>قيمة المنصة الإجمالية</span><span class="num">${f(c.total)} ج.م</span></div></div>
    </div></article>`;}).join("");
  const parts=[["كود المشروع",c.code,"تكلفة تطوير الكود",ic("code")],["اشتراكات الخدمات",c.services,DATA.expenses.flatMap(e=>String(e.note||e.name).split("·").map(t=>t.trim())).join(" · "),ic("server")],["اشتراكات نماذج AI",c.ai,DATA.ai.map(a=>`${a.model_name} × ${a.accounts}`).join(" · "),ic("bot")],["الحملة الإعلانية",c.ad,on?"شغالة الآن":"متوقفة",ic("mega")]];
  const cashPct=c.cash/c.total*100;
  const first=!window._r;window._r=1;
  $("app").className="grid"+(first?"":" static");
  $("app").innerHTML=`
  <section class="card hero" style="--i:0"><div class="win"></div>
    <div><div class="label">نظرة عامة · ${esc(s.platform_name)}</div>
      <h1 class="hello">${greet}،<br><b>فريق عرين</b></h1></div>
    <div>
      <div class="chips" style="margin-bottom:12px">
        <span class="chip">${ic("grad")} ${f(s.trial_teachers)} معلم تجريبي</span>
        <span class="chip">${ic("star")} ${f(s.pro_teachers)} معلم Pro</span>
        <span class="chip">${ic("users")} ${f(s.students)} طالب</span>
        <span class="chip ${on?"ok":"bad"}"><span class="dot ${on?"":"off"}"></span>${on?"الحملة شغالة":"الحملة متوقفة"}</span>
      </div>
      <p class="lead">قيمة المنصة <b>${f(c.total)} ج.م</b> موزعة على <b>${f(c.totalShares,0)} سهم</b> بسعر <b>${f(c.price)} ج.م</b> للسهم (القيمة ÷ الأسهم). دفع المستثمرون نقدًا <b>${f(c.cash)} ج.م</b> (${f(cashPct,1)}% من القيمة) وبقية الأسهم تعود للمبرمج من غير أي دفع نقدي.</p>
    </div></section>

  <section class="card dial" style="--i:1"><div class="label">توزيع الملكية</div>
    <div class="wrap">${dial(c)}<div class="mid"><div class="v">${N(c.totalShares,0,"ts")}</div><div class="u">إجمالي الأسهم</div></div></div>
    <div class="legend">${c.inv.map((x,k)=>`<div><span><i style="background:${COL[k%5]}"></i>${esc(x.name)}</span><b class="num">${f(x.pct,2)}%</b></div>`).join("")}</div></section>

  <article class="card scene" style="--i:2;--c:#e0b87c"><div class="tile">${ic("grad")}</div><div><div class="t">معلمين تجريبي</div><div class="v">${N(+s.trial_teachers,0,"tr")}</div></div></article>
  <article class="card scene" style="--i:3;--c:#4fe3b0"><div class="tile">${ic("star")}</div><div><div class="t">معلمين Pro</div><div class="v">${N(+s.pro_teachers,0,"pr")}</div></div></article>
  <article class="card scene" style="--i:4;--c:#7cc8f0"><div class="tile">${ic("users")}</div><div><div class="t">عدد الطلاب</div><div class="v">${N(+s.students,0,"st")}</div></div></article>
  <article class="card scene" style="--i:5;--c:#c79bf2"><div class="tile">${ic("coin")}</div><div><div class="t">سعر السهم</div><div class="v">${N(c.price,0,"sp")}<small>ج.م</small></div></div></article>

  <article class="card metric" style="--i:6"><div class="k">${ic("chart")} قيمة المنصة</div><div class="v">${N(c.total,0,"tv")} <small>ج.م</small></div><div class="bar"><i style="width:100%"></i></div><div class="f">كود + خدمات + نماذج + حملة</div></article>
  <article class="card metric" style="--i:6"><div class="k">${ic("wallet")} المدفوع نقدًا من المستثمرين</div><div class="v">${N(c.cash,0,"cs")} <small>ج.م</small></div><div class="bar"><i style="width:${cashPct}%"></i></div><div class="f">${f(cashPct,1)}% من قيمة المنصة</div></article>
  <article class="card metric" style="--i:7"><div class="k">${ic("box")} أسهم المستثمرين</div><div class="v">${N(c.cash/c.price,2,"is")} <small>سهم</small></div><div class="bar"><i style="width:${cashPct}%"></i></div><div class="f">المدفوع ÷ سعر السهم</div></article>
  <article class="card metric" style="--i:7"><div class="k">${ic("coin")} سعر الدولار</div><div class="v">${N(c.rate,2,"rt")} <small>ج.م</small></div><div class="bar"><i style="width:100%"></i></div><div class="f">${LIVE_RATE?"سعر لحظي تلقائي":"السعر المخزن"}</div></article>

  <section class="card price" style="--i:8"><div class="label">تسعير السهم</div>
    <h3>كيف يتحدد سعر السهم؟</h3><div class="sub">الطريقة العالمية: القيمة السوقية للشركة ÷ عدد الأسهم المصدرة. تتحدث تلقائيًا مع بيانات المنصة وسعر الدولار.</div>
    <div class="eqn"><div class="bx"><span>قيمة المنصة</span><b>${N(c.total,0,"pv")}</b><small>ج.م</small></div><i>÷</i><div class="bx"><span>الأسهم المصدرة</span><b>${N(c.totalShares,0,"pn")}</b><small>سهم</small></div><i>=</i><div class="bx hi"><span>سعر السهم</span><b>${N(c.price,0,"pp")}</b><small>ج.م</small></div></div>
    <div class="cols">
      <div><div class="h2">مكونات قيمة المنصة</div>${[["كود المشروع",c.code],["الخدمات والاشتراكات التقنية",c.services],["اشتراكات نماذج AI",c.ai],["الحملة الإعلانية",c.ad]].concat(c.traction>0?[["قيمة المستخدمين",c.traction]]:[]).map(r=>`<div class="pr"><span>${r[0]}</span><b class="num">${f(r[1])} ج.م</b></div>`).join("")}</div>
      <div><div class="h2">تكلفة شراء حصة من المنصة</div>${[1,5,10,25].map(p=>`<div class="pr"><span>${p}% <small>· ${f(c.totalShares*p/100,c.totalShares*p/100%1?2:0)} سهم</small></span><b class="num">${f(c.total*p/100)} ج.م</b></div>`).join("")}</div>
    </div></section>

  <div class="sec" id="investors"><h3>المستثمرون والمدفوع</h3><span>الأسهم تُحسب تلقائيًا من المبلغ المدفوع</span></div>
  ${invCards}

  <section class="card cap" id="capital" style="--i:10"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h3>من يملك ماذا</h3><b class="num" style="color:var(--mint)">${f(c.total)} ج.م</b></div>
    <div class="capbar">${c.inv.map((x,k)=>`<i style="width:${x.pct}%;background:${COL[k%5]}"></i>`).join("")}</div>
    <div class="caplg">${c.inv.map((x,k)=>`<span><i style="background:${COL[k%5]}"></i>${esc(x.name)}: ${x.is_remainder?`<b>بدون دفع نقدي</b> · ${f(x.shares,2)} سهم`:`<b class="num">${f(x.paid)} ج.م</b> نقدًا · ${f(x.shares,2)} سهم`} (${f(x.pct,1)}%)</span>`).join("")}</div></section>

  <div class="sec" id="components"><h3>مكونات القيمة</h3><span>الاشتراكات والنماذج</span></div>
  <section class="card comp" style="--i:11"><h3>تفصيل قيمة المنصة</h3><div class="sub">كل بند ونسبته من الإجمالي</div>
    ${parts.map(p=>`<div class="row"><div class="l"><div style="display:flex;gap:11px;align-items:center"><div class="tile" style="width:38px;height:38px;border-radius:12px">${p[3]}</div><div><div class="n">${esc(p[0])}</div><div class="m">${esc(p[2])}</div></div></div><div class="num" style="font-weight:800">${f(p[1])} ج.م</div></div><div class="bar"><i style="width:${p[1]/c.total*100}%"></i></div></div>`).join("")}</section>
  <section class="card ai" style="--i:12"><h3>اشتراكات نماذج الذكاء الاصطناعي</h3><div class="sub">عدد الحسابات وسعر الاشتراك</div>
    ${DATA.ai.map(a=>`<div class="row"><div class="l"><div style="display:flex;gap:11px;align-items:center"><div class="tile" style="--c:#c79bf2">${ic("bot")}</div><div><div class="n">${esc(a.model_name)}</div><div class="m">${f(a.accounts)} حساب × ${f(a.price_per_account)} ج.م</div></div></div><div class="num" style="font-weight:800">${f(a.accounts*a.price_per_account)} ج.م</div></div></div>`).join("")}</section>

  <section class="card ad" id="campaign" style="--i:13"><h3>الحملة الإعلانية</h3><div class="sub">الحالة وتكلفتها</div>
    <span class="state ${on?"on":"off"}"><span class="dot ${on?"":"off"}"></span>${on?"الحملة شغالة":"الحملة متوقفة"}</span>
    <div class="bigv">${N(+s.ad_campaign_price,0,"ad")} <small>ج.م</small></div>
    ${s.ad_auto_stop_on_update?'<div class="note">تتوقف الحملة تلقائيًا عند نزول أي تحديث جديد للمنصة.</div>':""}</section>
  <section class="card dev" style="--i:14"><h3>مبرمج المنصة</h3><div class="sub">صاحب الكود والتطوير</div>
    <div class="who"><div class="av" style="--c:#e0b87c;width:58px;height:58px;font-size:24px">${esc((s.developer_name||"؟").trim().charAt(0))}</div><div><div class="n" style="font-size:22px">${esc(s.developer_name)}</div>${(()=>{const d=c.inv.find(x=>x.is_remainder);return d?`<div class="r" style="color:var(--mut)">${f(d.shares,2)} سهم · ${f(d.pct,2)}% من المنصة</div>`:""})()}</div></div></section>`;
  counters();
}
document.addEventListener("pointermove",e=>{const c=e.target.closest&&e.target.closest(".card");if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty("--mx",(e.clientX-r.left)+"px");c.style.setProperty("--my",(e.clientY-r.top)+"px")});
load();setInterval(load,30000);
</script>
</body>
</html>
